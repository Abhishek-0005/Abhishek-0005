<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #000;
        }
        #road { 
            width: 300px; 
            height: 600px; 
            background-color: #444; 
            position: relative; 
        }
        .lane { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const LANES = [0, 100, 200];

        function Game() {
            const [laneIndex, setLaneIndex] = useState(1);
            const laneRef = useRef(laneIndex);
            const [enemies, setEnemies] = useState([]);
            const [speed, setSpeed] = useState(5);
            const [score, setScore] = useState(0);
            const [gameOver, setGameOver] = useState(false);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (gameOver) return;
                    if (e.key === 'ArrowLeft' && laneIndex > 0) {
                        setLaneIndex(laneIndex - 1);
                    } else if (e.key === 'ArrowRight' && laneIndex < 2) {
                        setLaneIndex(laneIndex + 1);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [laneIndex, gameOver]);

            useEffect(() => {
                const interval = setInterval(() => {
                    setSpeed(prev => prev + 0.5);
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const spawnEnemy = () => {
                    const lane = LANES[Math.floor(Math.random() * LANES.length)];
                    setEnemies(prev => [...prev, { lane, y: 0 }]);
                };
                const enemyInterval = setInterval(spawnEnemy, 1000);
                return () => clearInterval(enemyInterval);
            }, []);

            useEffect(() => {
                const moveEnemies = () => {
                    setEnemies(prev => {
                        const newEnemies = prev.map(enemy => ({ ...enemy, y: enemy.y + speed }));
                        newEnemies.forEach((enemy) => {
                            if (enemy.lane === LANES[laneIndex] && enemy.y > 520 && enemy.y < 600) {
                                setGameOver(true);
                            }
                        });
                        return newEnemies.filter(enemy => enemy.y < 600);
                    });
                };
                const moveInterval = setInterval(moveEnemies, 100);
                return () => clearInterval(moveInterval);
            }, [speed, laneIndex]);

            const restartGame = () => {
                setLaneIndex(1);
                setEnemies([]);
                setSpeed(5);
                setScore(0);
                setGameOver(false);
            };

            return (
                <div>
                    <div id="road">
                        {enemies.map((enemy, index) => (
                            <div key={index} className="lane" style={{ left: enemy.lane }} />
                        ))}
                    </div>
                    {gameOver && (
                        <div>
                            <h1>Game Over</h1>
                            <p>Final Score: {score}</p>
                            <button onClick={restartGame}>Restart</button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Game />);
    </script>
</body>
</html>
