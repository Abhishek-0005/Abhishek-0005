<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target Shooter</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; font-family: system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  #hud { display: flex; justify-content: space-between; width: 480px; margin: 8px 0; font-size: 14px; }
  canvas { background: #1f2937; border-radius: 8px; cursor: crosshair; touch-action: none; }
  button { background: #f59e0b; color: #111827; border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Target Shooter</h1>
  <div id="hud"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">30</b>s</span><span>Best: <b id="best">0</b></span></div>
  <canvas id="range" width="480" height="360"></canvas>
  <p>Click or tap the targets. Small targets score more. <button id="start">Start</button></p>
</main>
<script>
  var canvas = document.getElementById("range"), ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score"), timeEl = document.getElementById("time"), bestEl = document.getElementById("best");
  var best = Number(localStorage.getItem("target-best") || 0);
  var targets = [], shots = [], score = 0, timeLeft = 30, playing = false, spawnTimer, clockTimer, frame;
  bestEl.textContent = best;

  function spawn() {
    var r = 12 + Math.random() * 26;
    targets.push({
      x: r + Math.random() * (canvas.width - 2 * r),
      y: r + Math.random() * (canvas.height - 2 * r),
      r: r, vx: (Math.random() - 0.5) * 2.4, vy: (Math.random() - 0.5) * 2.4, life: 180
    });
  }

  function start() {
    targets = []; shots = []; score = 0; timeLeft = 30; playing = true;
    scoreEl.textContent = 0; timeEl.textContent = 30;
    clearInterval(spawnTimer); clearInterval(clockTimer); cancelAnimationFrame(frame);
    spawnTimer = setInterval(spawn, 700);
    clockTimer = setInterval(function () {
      timeLeft -= 1; timeEl.textContent = timeLeft;
      if (timeLeft <= 0) end();
    }, 1000);
    spawn(); spawn(); loop();
  }

  function end() {
    playing = false; clearInterval(spawnTimer); clearInterval(clockTimer);
    if (score > best) { best = score; localStorage.setItem("target-best", best); bestEl.textContent = best; }
    message("Time up - score " + score);
  }

  function message(text) {
    ctx.fillStyle = "rgba(17,24,39,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#f9fafb"; ctx.textAlign = "center"; ctx.font = "bold 26px system-ui";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  }

  function loop() {
    if (!playing) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    targets.forEach(function (t) {
      t.x += t.vx; t.y += t.vy; t.life -= 1;
      if (t.x < t.r || t.x > canvas.width - t.r) t.vx = -t.vx;
      if (t.y < t.r || t.y > canvas.height - t.r) t.vy = -t.vy;
      drawTarget(t);
    });
    targets = targets.filter(function (t) { return t.life > 0; });
    shots = shots.filter(function (s) { s.age += 1; return s.age < 12; });
    shots.forEach(function (s) {
      ctx.strokeStyle = s.hit ? "#22c55e" : "#9ca3af"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, 4 + s.age, 0, Math.PI * 2); ctx.stroke();
    });
    frame = requestAnimationFrame(loop);
  }

  function drawTarget(t) {
    var rings = ["#ef4444", "#f9fafb", "#ef4444", "#f9fafb"];
    for (var i = 0; i < rings.length; i++) {
      ctx.fillStyle = rings[i];
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r * (1 - i / rings.length), 0, Math.PI * 2); ctx.fill();
    }
  }

  function shoot(x, y) {
    if (!playing) return;
    var hit = false;
    for (var i = targets.length - 1; i >= 0; i--) {
      var t = targets[i], d = Math.hypot(x - t.x, y - t.y);
      if (d <= t.r) {
        score += d < t.r * 0.25 ? 3 + Math.round(40 / t.r) : 1 + Math.round(20 / t.r);
        targets.splice(i, 1); hit = true; break;
      }
    }
    shots.push({ x: x, y: y, age: 0, hit: hit });
    scoreEl.textContent = score;
  }

  function point(e) {
    var rect = canvas.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - rect.left) * canvas.width / rect.width, y: (p.clientY - rect.top) * canvas.height / rect.height };
  }
  canvas.addEventListener("mousedown", function (e) { var p = point(e); shoot(p.x, p.y); });
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); var p = point(e); shoot(p.x, p.y); });
  document.getElementById("start").addEventListener("click", start);
  message("Press Start");
</script>
</body>
</html>
