<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  canvas { background: #1e293b; border-radius: 8px; touch-action: none; }
  #info { display: flex; justify-content: space-between; width: 400px; margin: 8px 0; font-size: 14px; }
  button { background: #22c55e; color: #0f172a; border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Snake</h1>
  <div id="info"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="board" width="400" height="400"></canvas>
  <p>Arrow keys or WASD to move. Swipe on mobile. <button id="restart">Restart</button></p>
</main>
<script>
  var SIZE = 20, CELLS = 20, TICK = 110;
  var canvas = document.getElementById("board"), ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
  var best = Number(localStorage.getItem("snake-best") || 0);
  var snake, dir, next, food, score, timer, over, started;
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; next = dir; score = 0; over = false; started = false;
    scoreEl.textContent = 0; placeFood();
    clearInterval(timer); draw();
    message("Press an arrow key to start");
  }

  function message(text) {
    ctx.fillStyle = "rgba(15,23,42,0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e2e8f0"; ctx.textAlign = "center"; ctx.font = "bold 24px system-ui";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  }

  function placeFood() {
    do { food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) }; }
    while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function step() {
    dir = next;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
    var hitSelf = snake.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitWall || hitSelf) { gameOver(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1; scoreEl.textContent = score; placeFood();
    } else { snake.pop(); }
    draw();
  }

  function gameOver() {
    over = true; clearInterval(timer);
    if (score > best) { best = score; localStorage.setItem("snake-best", best); bestEl.textContent = best; }
    draw();
    message("Game over - " + score);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ef4444"; ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? "#22c55e" : "#16a34a";
      ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
    });
  }

  function turn(x, y) {
    if (over) return;
    if (x === -dir.x && y === -dir.y) return;
    next = { x: x, y: y };
    if (!started) { started = true; timer = setInterval(step, TICK); }
  }

  var KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
  document.addEventListener("keydown", function (e) {
    var k = KEYS[e.key]; if (!k) return;
    e.preventDefault(); turn(k[0], k[1]);
  });

  var startX = 0, startY = 0;
  canvas.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
  canvas.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });

  document.getElementById("restart").addEventListener("click", reset);
  reset();
</script>
</body>
</html>
